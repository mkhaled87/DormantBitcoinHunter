[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dormant-bitcoin-hunter"
version = "0.2.0"
description = "A multi-process Bitcoin private key generator and dormant address hunter"
readme = "readme.md"
requires-python = ">=3.8"
license = "MIT"
authors = [
    { name = "mkhaled87" }
]
dependencies = [
    "bitcoinlib>=0.7.10",
    "ecdsa>=0.19.0",
]

[project.urls]
Homepage = "https://github.com/mkhaled87/DormantBitcoinHunter"
Repository = "https://github.com/mkhaled87/DormantBitcoinHunter"

[tool.setuptools]
py-modules = ["hunt", "addresses"]
